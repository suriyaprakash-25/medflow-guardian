name: One-time UI readiness layout patch

on:
  push:
    branches:
      - ui/production-readiness-phases-1-5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI readiness branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/production-readiness-phases-1-5
          fetch-depth: 0
      - name: Apply guarded shell and safety patch
        run: python scripts/apply_ui_layout_patch.py
      - name: Commit UI readiness patch and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ui: harden responsive shells consent and triage language"
          git push origin HEAD:ui/production-readiness-phases-1-5
