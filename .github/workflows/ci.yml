name: MedFlow Guardian CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medflow
          POSTGRES_PASSWORD: password
          POSTGRES_DB: medflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medflow -d medflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Apply database migrations
      env:
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        alembic upgrade head

    - name: Run R6 FHIR interoperability verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_fhir_consent_import.py tests/test_fhir_consent_import_fail_closed.py tests/test_fhir_serialization.py tests/test_fhir_export_cae.py tests/test_interoperability_auth.py -v

    - name: Run R8 session websocket and proxy security verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_r8_session_websocket_rate_limit.py -v

    - name: Run R7 storage, malware, worker, and audit verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_malware_scanner.py tests/test_malware_scan_state.py tests/test_malware_worker.py tests/test_storage_security.py tests/test_malware_quarantine.py tests/test_authorization_audit_fail_closed.py -v

    - name: Start live ClamAV for R7 protocol verification
      run: |
        docker run -d --name clamav-r7 -p 3310:3310 \
          -e CLAMAV_NO_FRESHCLAMD=true \
          clamav/clamav:stable
        python - <<'PY'
        import socket
        import time

        deadline = time.time() + 180
        last_error = None
        while time.time() < deadline:
            try:
                with socket.create_connection(("127.0.0.1", 3310), timeout=3) as sock:
                    sock.settimeout(3)
                    sock.sendall(b"zPING\0")
                    response = sock.recv(64)
                    if b"PONG" in response:
                        print("clamd is ready")
                        raise SystemExit(0)
            except OSError as exc:
                last_error = exc
            time.sleep(3)

        raise SystemExit(f"clamd did not become ready: {last_error}")
        PY

    - name: Run live ClamAV INSTREAM integration tests
      env:
        CLAMAV_INTEGRATION: "1"
        CLAMAV_HOST: 127.0.0.1
        CLAMAV_PORT: "3310"
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_clamav_integration.py -v

    - name: Stop live ClamAV
      if: always()
      run: |
        docker logs clamav-r7 || true
        docker rm -f clamav-r7 || true

    - name: Run Backend Security & Integration Tests
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [patient-app, doctor-portal, admin-portal]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ matrix.app }}/package-lock.json

    - name: Install and Build ${{ matrix.app }}
      run: |
        npm ci --prefix frontend-shared
        cd ${{ matrix.app }}
        npm ci
        npm run build