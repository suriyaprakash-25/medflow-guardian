name: MedFlow Guardian CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medflow
          POSTGRES_PASSWORD: password
          POSTGRES_DB: medflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medflow -d medflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        pip check

    - name: Provision Supabase-compatible browser roles
      env:
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
      run: |
        python - <<'PY'
        import os
        import psycopg2

        connection = psycopg2.connect(os.environ["DATABASE_URL"])
        connection.autocommit = True
        with connection.cursor() as cursor:
            cursor.execute("CREATE ROLE anon NOLOGIN")
            cursor.execute("CREATE ROLE authenticated NOLOGIN")
            cursor.execute("GRANT USAGE ON SCHEMA public TO anon, authenticated")
            cursor.execute(
                "ALTER DEFAULT PRIVILEGES IN SCHEMA public "
                "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO anon, authenticated"
            )
            cursor.execute(
                "ALTER DEFAULT PRIVILEGES IN SCHEMA public "
                "GRANT USAGE, SELECT ON SEQUENCES TO anon, authenticated"
            )
        connection.close()
        PY

    - name: Apply database migrations
      env:
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        alembic upgrade head

    - name: Run P0 database integrity verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_database_integrity.py -v

    - name: Verify latest migrations round-trip and schema drift
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        alembic downgrade 7b2c91e4d6a8
        alembic upgrade head
        alembic check
        pytest tests/test_database_integrity.py -v

    - name: Run R6 FHIR interoperability verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_fhir_consent_import.py tests/test_fhir_consent_import_fail_closed.py tests/test_fhir_serialization.py tests/test_fhir_export_cae.py tests/test_interoperability_auth.py -v

    - name: Run R8 session websocket and proxy security verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_r8_session_websocket_rate_limit.py -v

    - name: Run R7 storage, malware, worker, and audit verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_malware_scanner.py tests/test_malware_scan_state.py tests/test_malware_worker.py tests/test_storage_security.py tests/test_malware_quarantine.py tests/test_authorization_audit_fail_closed.py -v

    - name: Start live ClamAV for R7 protocol verification
      run: |
        docker run -d --name clamav-r7 -p 3310:3310 \
          -e CLAMAV_NO_FRESHCLAMD=true \
          clamav/clamav:stable
        python - <<'PY'
        import socket
        import time

        deadline = time.time() + 180
        last_error = None
        while time.time() < deadline:
            try:
                with socket.create_connection(("127.0.0.1", 3310), timeout=3) as sock:
                    sock.settimeout(3)
                    sock.sendall(b"zPING\0")
                    response = sock.recv(64)
                    if b"PONG" in response:
                        print("clamd is ready")
                        raise SystemExit(0)
            except OSError as exc:
                last_error = exc
            time.sleep(3)

        raise SystemExit(f"clamd did not become ready: {last_error}")
        PY

    - name: Run live ClamAV INSTREAM integration tests
      env:
        CLAMAV_INTEGRATION: "1"
        CLAMAV_HOST: 127.0.0.1
        CLAMAV_PORT: "3310"
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_clamav_integration.py -v

    - name: Stop live ClamAV
      if: always()
      run: |
        docker logs clamav-r7 || true
        docker rm -f clamav-r7 || true

    - name: Run R9 deployment configuration verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_r9_deployment_configuration.py tests/test_r9_frontend_deployment_contract.py -v

    - name: Run P2 AI boundary and configuration verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_p2_medium_security_regressions.py -v

    - name: Run P3 production hardening verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_p3_production_hardening.py -v

    - name: Run Backend Security & Integration Tests
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [patient-app, doctor-portal, admin-portal]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ matrix.app }}/package-lock.json

    - name: Install shared frontend dependencies
      run: npm ci --prefix frontend-shared

    - name: Install ${{ matrix.app }} dependencies
      run: npm ci --prefix ${{ matrix.app }}

    - name: Lint ${{ matrix.app }}
      run: npm run lint --prefix ${{ matrix.app }}

    - name: Test ${{ matrix.app }}
      run: npm test --prefix ${{ matrix.app }}

    - name: Build ${{ matrix.app }}
      run: npm run build --prefix ${{ matrix.app }}
