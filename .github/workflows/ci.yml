name: MedFlow Guardian CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medflow
          POSTGRES_PASSWORD: password
          POSTGRES_DB: medflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Phase 4.1 FHIR Consent import verification
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/test_fhir_consent_import.py tests/test_fhir_consent_import_fail_closed.py tests/test_interoperability_auth.py -v

    - name: Run Backend Security & Integration Tests
      env:
        TESTING: "True"
        ENV: test
        DATABASE_URL: postgresql://medflow:password@localhost:5432/medflow_test
        SECRET_KEY: test_secret_key_ci
        SUPABASE_URL: http://localhost:8000
        SUPABASE_SERVICE_ROLE_KEY: dummy_key
        SUPABASE_STORAGE_BUCKET: medflow-bucket
      run: |
        cd backend
        pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [patient-app, doctor-portal, admin-portal]
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install and Build ${{ matrix.app }}
      run: |
        cd ${{ matrix.app }}
        npm install
        npm run build
