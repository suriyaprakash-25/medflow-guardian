name: P1 refresh Postman artifact

on:
  push:
    branches: ['p1/completion-contracts-consent-deployment-fhir']

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[p1-postman-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: test
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      SECRET_KEY: p1_postman_refresh_secret
      SUPABASE_URL: http://127.0.0.1:8000
      SUPABASE_SERVICE_ROLE_KEY: dummy_key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Generate canonical endpoint collection
        run: cd backend && python -m scripts.generate_postman_collection
      - name: Commit generated artifact and self-remove
        run: |
          rm .github/workflows/p1-refresh-postman.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/postman/MedFlow-All-Endpoints.postman_collection.json .github/workflows/p1-refresh-postman.yml
          git commit -m "docs(p1): refresh all-endpoints contract [p1-postman-refresh]"
          git push origin HEAD:p1/completion-contracts-consent-deployment-fhir
