name: Sync feature generated contracts

on:
  push:
    branches:
      - feature/oidc-fhir-binary-access-lifecycle

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Regenerate canonical contracts
        env:
          TESTING: "True"
          ENV: test
          DATABASE_URL: sqlite:////tmp/medflow-contract-sync.db
          SECRET_KEY: generated_contract_sync_secret
          SUPABASE_URL: http://127.0.0.1:8000
          SUPABASE_SERVICE_ROLE_KEY: dummy_key
        run: |
          cd backend
          python -m scripts.export_fhir_capability
          python -m scripts.generate_postman_collection
      - name: Commit generated contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/fhir_validation/capability-statement.json docs/postman/MedFlow-All-Endpoints.postman_collection.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync generated API contracts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
