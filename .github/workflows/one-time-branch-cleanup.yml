name: One-time branch cleanup

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Delete every branch except main and dev
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{sub("refs/heads/", "", $2); print $2}' \
            | while read -r branch; do
                case "$branch" in
                  main|dev) ;;
                  *) git push origin --delete "$branch" ;;
                esac
              done

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-branch-cleanup.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:dev
