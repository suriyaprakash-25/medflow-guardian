name: Cleanup merged feature branch

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'suriyaprakash-25/medflow-guardian' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/feature%2Foidc-fhir-binary-access-lifecycle"
