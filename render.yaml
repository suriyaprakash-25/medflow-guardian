# MedFlow Guardian production infrastructure definition.
# Deployments wait for GitHub CI checks and migrations run in pre-deploy, not build.

services:
  - type: web
    name: medflow-backend-prod
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    preDeployCommand: "cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --no-server-header"
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENV
        value: production
      - key: MEDFLOW_SERVICE_ROLE
        value: web
      - key: PYTHON_VERSION
        value: "3.11.16"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: medical-documents
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: PATIENT_APP_ORIGIN
        fromService:
          type: web
          name: medflow-patient-app-prod
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCTOR_PORTAL_ORIGIN
        fromService:
          type: web
          name: medflow-doctor-portal-prod
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_PORTAL_ORIGIN
        fromService:
          type: web
          name: medflow-admin-portal-prod
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_CORS_ORIGINS
        sync: false

  # Durable recovery for pending document scans. The HTTP BackgroundTask remains
  # the low-latency path; this worker guarantees persisted pending scans are
  # revisited after web-process restarts.
  - type: worker
    name: medflow-malware-worker-prod
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m app.workers.malware_worker"
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENV
        value: production
      - key: MEDFLOW_SERVICE_ROLE
        value: malware_worker
      - key: PYTHON_VERSION
        value: "3.11.16"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: medical-documents
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: CLAMAV_TIMEOUT_SECONDS
        value: "15"
      - key: CLAMAV_MAX_BYTES
        value: "10485760"
      - key: MALWARE_WORKER_BATCH_SIZE
        value: "25"
      - key: MALWARE_WORKER_POLL_SECONDS
        value: "5"

  - type: web
    name: medflow-patient-app-prod
    runtime: static
    buildCommand: "cd patient-app && npm ci && npm run build"
    staticPublishPath: ./patient-app/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medflow-backend-prod
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: medflow-doctor-portal-prod
    runtime: static
    buildCommand: "cd doctor-portal && npm ci && npm run build"
    staticPublishPath: ./doctor-portal/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medflow-backend-prod
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: medflow-admin-portal-prod
    runtime: static
    buildCommand: "cd admin-portal && npm ci && npm run build"
    staticPublishPath: ./admin-portal/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medflow-backend-prod
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
