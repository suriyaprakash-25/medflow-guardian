[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# The backend suite shares one PostgreSQL integration database. Keep the default
# run serial to avoid cross-worker row/table locks. pytest-xdist remains installed
# for explicitly isolated tests (for example: pytest -n auto tests/unit/...).
# Coverage is also opt-in so pytest can start even in a stale virtualenv before
# optional test plugins are refreshed from requirements.txt.
addopts = -v
filterwarnings =
    ignore::DeprecationWarning
