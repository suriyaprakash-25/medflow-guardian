services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medflow_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflow -d medflow_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ./backend/scripts/init_test_database.sql:/docker-entrypoint-initdb.d/001-medflow-test-roles.sql:ro
